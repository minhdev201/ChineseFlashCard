</head>

<body>
  <!-- Top Navigation Header (Decorative / Non-interactive) -->

      <span class="header-link">Gmail</span>
      <span class="header-link">Hình ảnh</span>
    </div>
    <div class="header-actions">
      <!-- 9-dot Google apps icon -->
      <div class="icon-btn" aria-hidden="true">
        <svg class="apps-icon" viewBox="0 0 24 24" width="20" height="20">

            d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zM6 4c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z" />
        </svg>
      </div>

      <!-- Account Avatar with Cyan ring (matching screenshot) -->
      <div class="avatar-circle" title="minhdev201@gmail.com">
        <span>M</span>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <!-- Monochrome Google Logo (Decorative) -->

        <path fill="#e8eaed"

        <path fill="#e8eaed" d="M225 3v65h-9.5V3h9.5z" />
        <path fill="#e8eaed"
          d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-13.86-8.23l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z" />
        <path fill="#e8eaed"

      </svg>
    </div>

    <!-- White Search Box (Decorative / Non-interactive) -->
    <div class="search-box-container non-interactive">
      <div class="search-form">
        <div class="search-icon-left">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </div>
        <div class="search-input-placeholder">Hỏi Google hoặc nhập URL</div>
        <div class="search-actions-right">
          <!-- Voice Search Mic -->
          <div class="search-tool-btn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="#4285F4">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
              <path
                d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"
                fill="#EA4335" />
            </svg>
          </div>
          <!-- Google Lens -->
          <div class="search-tool-btn">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="#4285F4" d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
              <path fill="#FBBC05"
                d="M19 6.5h-1.4l-1.1-1.5c-.3-.4-.8-.7-1.3-.7H8.8c-.5 0-1 .3-1.3.7L6.4 6.5H5c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2Zm-7 12c-2.8 0-5-2.2-5-5s2.2-5 5-5 5 2.2 5 5-2.2 5-5 5Z" />
            </svg>
          </div>
          <!-- AI Mode Pill Button -->
          <div class="ai-mode-pill">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path
                d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z" />
            </svg>
            <span>Chế độ AI</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Shortcuts Grid (Decorative / Non-interactive) -->
    <div class="shortcuts-grid non-interactive">
      <!-- Shortcut 1: 22 -->
      <div class="shortcut-tile">
        <div class="shortcut-icon-circle">
          <span class="custom-shortcut-icon red-e">E</span>
        </div>
        <span class="shortcut-title">22</span>
      </div>

      <!-- Shortcut 2: 23 -->
      <div class="shortcut-tile">
        <div class="shortcut-icon-circle">
          <span class="custom-shortcut-icon red-e">E</span>
        </div>
        <span class="shortcut-title">23</span>
      </div>

      <!-- Shortcut 3: ChatGPT -->
      <div class="shortcut-tile">
        <div class="shortcut-icon-circle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#ffffff">
            <path
              d="M22.2819 9.8211a5.9847 5.9847 0 0 0-.5157-4.9108 6.0462 6.0462 0 0 0-6.5098-2.9A6.0651 6.0651 0 0 0 4.9807 4.1818a5.9847 5.9847 0 0 0-3.9977 2.9 6.0462 6.0462 0 0 0 .7427 7.0966 5.98 5.98 0 0 0 .511 4.9107 6.051 6.051 0 0 0 6.5146 2.9001A5.9847 5.9847 0 0 0 13.2599 24a6.0557 6.0557 0 0 0 5.7718-4.2058 5.9894 5.9894 0 0 0 3.9977-2.9001 6.0557 6.0557 0 0 0-.7475-7.0729zm-9.022 12.6081a4.4755 4.4755 0 0 1-2.8764-1.0408l.1419-.0804 4.7783-2.7582a.7948.7948 0 0 0 .3927-.6813v-6.7369l2.02 1.1686a.071.071 0 0 1 .038.052v5.5826a4.504 4.504 0 0 1-4.4945 4.4944zm-9.6607-4.1254a4.4708 4.4708 0 0 1-.5346-3.0137l.142.0852 4.783 2.7582a.7712.7712 0 0 0 .7806 0l5.8428-3.3685v2.3324a.0804.0804 0 0 1-.0332.0615L9.74 19.9502a4.4992 4.4992 0 0 1-6.1408-1.6464zM2.3408 7.8956a4.485 4.485 0 0 1 2.3655-1.9728V11.6a.7664.7664 0 0 0 .3879.6765l5.8144 3.3543-2.0201 1.1685a.0757.0757 0 0 1-.071 0l-4.8303-2.7865A4.504 4.504 0 0 1 2.3408 7.8956zm16.0993 3.8558L12.5973 8.3829l2.02-1.1638a.0804.0804 0 0 1 .071 0l4.8303 2.7913a4.4944 4.4944 0 0 1-.6765 8.1042v-5.6772a.79.79 0 0 0-.4023-.686zm2.0107-3.0231l-.142-.0852-4.7735-2.7818a.7759.7759 0 0 0-.7854 0L9.409 9.2297V6.8974a.0662.0662 0 0 1 .0284-.0615l4.8303-2.7866a4.4992 4.4992 0 0 1 6.6802 4.66zM8.3065 12.863l-2.02-1.1638a.0804.0804 0 0 1-.038-.0567V6.0742a4.4992 4.4992 0 0 1 7.3757-3.4537l-.142.0805L8.704 5.459a.7948.7948 0 0 0-.3927.6813v6.7227zm1.1444-2.5293l3.0003-1.7303 3.0004 1.7303v3.4606l-3.0004 1.7303-3.0003-1.7303z" />
          </svg>
        </div>
        <span class="shortcut-title">ChatGPT</span>
      </div>

      <!-- Shortcut 4: Google Dịch -->
      <div class="shortcut-tile">
        <div class="shortcut-icon-circle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#4285F4">
            <path
              d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z" />
          </svg>
        </div>
        <span class="shortcut-title">Google Dịch</span>
      </div>

      <!-- Shortcut 5: YouTube -->
      <div class="shortcut-tile">
        <div class="shortcut-icon-circle">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#FF0000">
            <path
              d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
          </svg>
        </div>
        <span class="shortcut-title">YouTube</span>
      </div>

      <!-- Shortcut 6: Facebook -->
      <div class="shortcut-tile">
        <div class="shortcut-icon-circle">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="#1877F2">
            <path
              d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
          </svg>
        </div>
        <span class="shortcut-title">Facebook</span>
      </div>

      <!-- Shortcut 7: Hiện thêm -->
      <div class="shortcut-tile">
        <div class="shortcut-icon-circle">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#9aa0a6" stroke-width="2">
            <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
          </svg>
        </div>
        <span class="shortcut-title">Hiện thêm</span>
      </div>
    </div>

    <!-- ================================================================= -->
    <!-- ONLY INTERACTIVE VOCABULARY ZONE (RED BOXED AREA)                  -->
    <!-- All user operations are focused strictly in this area             -->
    <!-- ================================================================= -->
    <section class="spacious-vocab-zone" id="vocabCardArea">
      <div id="loadingState" class="vocab-loading hidden">
        <span class="loading-pulse-dot"></span>
      </div>

      <div id="vocabCard" class="spacious-card">
        <!-- Prominent Hanzi & TTS Audio -->
        <div class="hanzi-display-wrap">
          <span class="hanzi-big" id="hanzi" title="Nhấp để phát âm (Phím P)">你好</span>
          <button id="speakBtn" class="audio-btn" title="Phát âm tiếng Trung (Phím P)">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="currentColor" stroke-width="2"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14" fill="none" stroke="currentColor" stroke-width="2"></path>
            </svg>
          </button>
        </div>

        <!-- BOTH PINYIN AND MEANING ARE BLURRED (Hover or click to reveal) -->
        <div class="blur-interactive-area" id="blurArea" title="Rê chuột vào đây để mở mờ Pinyin và Nghĩa">
          <div class="pinyin-display blurred" id="pinyin">nǐ hǎo</div>
          <div class="meaning-display blurred" id="meaning">Xin chào</div>
          <div class="hover-tip-text">Hover để xem Pinyin & Nghĩa</div>
        </div>

        <!-- Action Buttons for Vocabulary -->
        <div class="spacious-actions">
          <button id="markRememberedBtn" class="stealth-action-btn" title="Đánh dấu đã nhớ từ này">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Đã nhớ</span>
          </button>

          <button id="nextBtn" class="stealth-action-btn primary" title="Xem từ tiếp theo (Phím Space)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
            <span>Từ tiếp theo (Space)</span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="newtab.js"></script>
</body>

</html>
